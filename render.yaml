# Render blueprint for the public demonstration (docs/deployment.md). Free plan: the service
# sleeps after 15 minutes without requests and needs about a minute to wake up.
# Deployed from main only after the CI checks of the commit passed.
services:
  - type: web
    name: quality-intelligence
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: checksPass
    healthCheckPath: /api/health
    envVars:
      - key: QI_HISTORY_URL
        value: https://github.com/niranjankagri/automation-coverage-quality-intelligence/releases/download/history/quality.db
      - key: QI_COLLECTION_URL
        value: https://github.com/niranjankagri/automation-coverage-quality-intelligence/actions/workflows/collect.yml
