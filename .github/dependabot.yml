# Update proposals for the pinned dependencies (docs/operations.md). Monthly and grouped, so
# there is one pull request per ecosystem to review; security updates are not delayed by this.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
