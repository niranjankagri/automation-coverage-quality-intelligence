# Smoke test of the hosted demonstration (docs/deployment.md), after the daily collection and on
# demand. The address is the repository variable QI_LIVE_URL; without it there is nothing to test.
name: Live dashboard

on:
  schedule:
    - cron: "30 8 * * *" # after the collection (07:40 UTC) and the hourly fetch
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke test of the live dashboard
    if: vars.QI_LIVE_URL != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      # The free service may be asleep: up to three minutes to wake up
      - run: python tools/smoke.py "${{ vars.QI_LIVE_URL }}" --wait 180 --collected
