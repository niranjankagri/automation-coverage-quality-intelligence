# CI: static checks first (lint, format, types), then the tests on both supported Python versions
# and the dashboard in a real browser. Every test job keeps its JUnit XML as an artifact.
# The e2e extra (the Playwright Python package) is installed everywhere because tests/e2e and
# tools/ import it; only the browser job downloads a browser.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to a branch cancels the older run. On main every commit gets its own group
# (the commit sha), so each commit keeps a finished run: with one shared group GitHub would
# still cancel queued runs, even without cancel-in-progress.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, format, types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,e2e]"
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .
      - name: mypy (strict)
        run: mypy

  tests:
    name: Tests (Python ${{ matrix.python }})
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev,e2e]"
      # Coverage below 90 % fails the job (fail_under in pyproject.toml)
      - name: pytest
        run: pytest --cov --cov-report=term --junitxml=reports/junit-${{ matrix.python }}.xml
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-python-${{ matrix.python }}
          path: reports/
          if-no-files-found: error

  dashboard:
    name: Dashboard in Chromium
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,e2e]"
      - name: Install Chromium
        run: playwright install --with-deps chromium
      - name: pytest -m e2e
        run: pytest -m e2e --junitxml=reports/junit-e2e.xml
      # The same screenshots as in docs/images, taken on this run, as evidence of what the page shows
      - name: Screenshots
        if: always()
        run: python tools/screenshots.py reports/screenshots
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-e2e
          path: reports/
          if-no-files-found: error

  # The platform used as a release gate on the sample data. Each step asserts the exit code it
  # must produce, so the job proves the three outcomes on every push: passed (0), failed (1)
  # and incomplete input (3). Reports are kept as artifacts and summarised on the run page.
  quality-gate:
    name: Quality gates (sample data)
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,e2e]"
      - name: Nightly gate on the latest runs (must pass)
        run: >-
          qi gate --catalog samples/catalog.toml --config samples/gates/nightly.toml samples/results
          --json reports/gates/nightly.json --html reports/gates/nightly.html --summary "$GITHUB_STEP_SUMMARY"
      - name: Release gate (must fail on the two uncovered critical requirements)
        run: |
          set +e
          qi gate --catalog samples/catalog.toml --config samples/gates/release.toml samples/results \
            --json reports/gates/release.json --html reports/gates/release.html --summary "$GITHUB_STEP_SUMMARY"
          code=$?
          set -e
          echo "exit code $code"
          test "$code" -eq 1
      - name: Nightly gate on the real failed attempt of 19 Oct (must fail)
        run: |
          set +e
          qi gate --catalog samples/catalog.toml --config samples/gates/nightly.toml \
            samples/results/playwright-toolshop-firefox/2026-10-19_07f8c24_39229363499-attempt1.xml \
            --json reports/gates/nightly-attempt1.json --summary "$GITHUB_STEP_SUMMARY"
          code=$?
          set -e
          test "$code" -eq 1
      - name: Gate without result files (must be incomplete, never passed)
        run: |
          set +e
          qi gate --catalog samples/catalog.toml --config samples/gates/nightly.toml results-that-do-not-exist/ \
            --json reports/gates/incomplete.json --summary "$GITHUB_STEP_SUMMARY"
          code=$?
          set -e
          test "$code" -eq 3
      - name: Keep the gate reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-gate-reports
          path: reports/gates/
          if-no-files-found: error
