# CI: static checks first (lint, format, types), then the tests on both supported Python versions
# and the dashboard in a real browser. Every test job keeps its JUnit XML as an artifact.
# The e2e extra (the Playwright Python package) is installed everywhere because tests/e2e and
# tools/ import it; only the browser job downloads a browser.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to a branch cancels the older run. On main every commit gets its own group
# (the commit sha), so each commit keeps a finished run: with one shared group GitHub would
# still cancel queued runs, even without cancel-in-progress.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, format, types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,e2e]"
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .
      - name: mypy (strict)
        run: mypy

  tests:
    name: Tests (Python ${{ matrix.python }}${{ matrix.os == 'windows-latest' && ', Windows' || '' }})
    needs: checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.12", "3.13"]
        # Windows too: the README's first instructions are for cmd.exe
        include:
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev,e2e]"
      # Coverage below 90 % fails the job (fail_under in pyproject.toml)
      - name: pytest
        run: pytest --cov --cov-report=term --junitxml=reports/junit-${{ matrix.python }}.xml
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-python-${{ matrix.python }}${{ matrix.os == 'windows-latest' && '-windows' || '' }}
          path: reports/
          if-no-files-found: error

  dashboard:
    name: Dashboard in Chromium
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,e2e]"
      - name: Install Chromium
        run: playwright install --with-deps chromium
      - name: pytest -m e2e
        run: pytest -m e2e --junitxml=reports/junit-e2e.xml
      # The same screenshots as in docs/images, taken on this run, as evidence of what the page shows
      - name: Screenshots
        if: always()
        run: python tools/screenshots.py reports/screenshots
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-e2e
          path: reports/
          if-no-files-found: error

  # The platform used as a release gate on the sample data. Each step asserts the exit code it
  # must produce, so the job proves the three outcomes on every push: passed (0), failed (1)
  # and incomplete input (3). Reports are kept as artifacts and summarised on the run page.
  quality-gate:
    name: Quality gates (sample data)
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,e2e]"
      - name: Nightly gate on the latest runs (must pass)
        run: >-
          qi gate --catalog samples/catalog.toml --config samples/gates/nightly.toml samples/results
          --json reports/gates/nightly.json --html reports/gates/nightly.html --summary "$GITHUB_STEP_SUMMARY"
      - name: Release gate (must fail on the two uncovered critical requirements)
        run: |
          set +e
          qi gate --catalog samples/catalog.toml --config samples/gates/release.toml samples/results \
            --json reports/gates/release.json --html reports/gates/release.html --summary "$GITHUB_STEP_SUMMARY"
          code=$?
          set -e
          echo "exit code $code"
          test "$code" -eq 1
      - name: Nightly gate on the real failed attempt of 19 Oct (must fail)
        run: |
          set +e
          qi gate --catalog samples/catalog.toml --config samples/gates/nightly.toml \
            samples/results/playwright-toolshop-firefox/2026-10-19_07f8c24_39229363499-attempt1.xml \
            --json reports/gates/nightly-attempt1.json --summary "$GITHUB_STEP_SUMMARY"
          code=$?
          set -e
          test "$code" -eq 1
      - name: Gate without result files (must be incomplete, never passed)
        run: |
          set +e
          qi gate --catalog samples/catalog.toml --config samples/gates/nightly.toml results-that-do-not-exist/ \
            --json reports/gates/incomplete.json --summary "$GITHUB_STEP_SUMMARY"
          code=$?
          set -e
          test "$code" -eq 3
      - name: Keep the gate reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-gate-reports
          path: reports/gates/
          if-no-files-found: error

  # The platform gates its own release: quality/catalog.toml lists the plan's acceptance
  # criteria and rules, linked to this repository's tests; the JUnit files of the test and
  # browser jobs are the input. Fails the build when a criterion loses its tests or a test fails.
  self-gate:
    name: Self gate (acceptance criteria)
    needs: [tests, dashboard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,e2e]"
      # A missing artifact must not stop this job: the gate itself reports missing input (exit 3)
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: junit-python-3.12
          path: own-results/unit
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: dashboard-e2e
          path: own-results/e2e
      - name: qi gate on this repository's own results
        run: >-
          qi gate --catalog quality/catalog.toml --config quality/release.toml
          own-results/unit/junit-3.12.xml own-results/e2e/junit-e2e.xml
          --context framework=pytest --context environment=ci --context build=${{ github.sha }}
          --json reports/self-gate.json --html reports/self-gate.html --summary "$GITHUB_STEP_SUMMARY"
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: self-gate-report
          path: reports/
          if-no-files-found: error

  # Acceptance criterion 9: a clean checkout reproduces the documented demonstration
  demo:
    name: Demonstration from a clean checkout (${{ matrix.os }})
    needs: checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: python tools/demo.py
        run: python tools/demo.py demo-output
      - name: Keep the demonstration output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: demo-output-${{ matrix.os }}
          path: demo-output/
          if-no-files-found: error
