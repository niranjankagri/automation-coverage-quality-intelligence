# Collect the CI results of the producer repositories into history (docs/collection.md).
#
# Daily, and on demand. The history database lives as the asset quality.db of the release
# "history" of this repository (permanent, public: results of public repositories only), which
# the hosted dashboard fetches (docs/deployment.md); each run also keeps it as the artifact
# "quality-history". It fails closed: when an earlier history exists but cannot be restored,
# the job stops instead of starting over with an empty database.
name: Collect CI results

on:
  schedule:
    - cron: "40 7 * * *" # after the producers' nightly runs (06:00-07:30 UTC)
  workflow_dispatch:
    inputs:
      days:
        description: "Collect runs started in the last N days (1-90)"
        default: "3"

permissions:
  contents: write # publish the history as a release asset
  actions: read # list this workflow's earlier runs and download their history artifact

# One collection at a time: two would race on the same history
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    name: Collect and audit
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e .
      - name: Restore the history of the last successful collection
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p history
          previous=$(gh run list --workflow collect.yml --status success --limit 1 --json databaseId -q '.[0].databaseId')
          if gh release view history > /dev/null 2>&1; then
            gh release download history --pattern quality.db --dir history
            echo "Restored the published history."
          elif [ -n "$previous" ]; then
            gh run download "$previous" --name quality-history --dir history
            echo "Restored history of run $previous."
          else
            echo "No earlier history: starting a new one."
          fi
          if [ -e history/quality.db ]; then qi history check --database history/quality.db; fi
      - name: qi collect
        env:
          # A token that may download the producers' artifacts; the workflow token is tried
          # when no COLLECT_TOKEN secret is set (docs/collection.md, "Token")
          GITHUB_TOKEN: ${{ secrets.COLLECT_TOKEN || github.token }}
        run: >-
          qi collect --producers config/producers.toml --database history/quality.db
          --days ${{ inputs.days || '3' }} --summary "$GITHUB_STEP_SUMMARY"
      - name: Keep the history
        # Also after a partly failed collection: what was stored is valid (one transaction per run)
        if: always() && steps.restore.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-history
          path: history/quality.db
          retention-days: 90
          if-no-files-found: error
      # Only a fully successful collection is published: retention, a verified copy, then the
      # release asset the dashboard fetches (created on the first run, never marked latest)
      - name: Publish the history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          qi history prune --keep-days 365 --database history/quality.db
          qi history backup publish/quality.db --database history/quality.db
          if ! gh release view history > /dev/null 2>&1; then
            gh release create history --title "Collected history (data)" --latest=false --prerelease --notes "The history database of the daily collection (docs/collection.md). Replaced by every successful collection; fetched by the hosted dashboard. Results of public repositories only."
          fi
          gh release upload history publish/quality.db --clobber
