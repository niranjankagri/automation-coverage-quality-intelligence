# Collect the CI results of the producer repositories into history (docs/collection.md).
#
# Daily, and on demand. The history database is carried from one collection run to the next as
# the artifact "quality-history" until the platform has a permanent host (plan M3). It fails
# closed: when an earlier history exists but cannot be restored, the job stops instead of
# starting over with an empty database.
name: Collect CI results

on:
  schedule:
    - cron: "40 7 * * *" # after the producers' nightly runs (06:00-07:30 UTC)
  workflow_dispatch:
    inputs:
      days:
        description: "Collect runs started in the last N days (1-90)"
        default: "3"

permissions:
  contents: read
  actions: read # list this workflow's earlier runs and download their history artifact

# One collection at a time: two would race on the same history
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    name: Collect and audit
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e .
      - name: Restore the history of the last successful collection
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p history
          previous=$(gh run list --workflow collect.yml --status success --limit 1 --json databaseId -q '.[0].databaseId')
          if [ -z "$previous" ]; then
            echo "No earlier successful collection: starting a new history."
          else
            gh run download "$previous" --name quality-history --dir history
            test -s history/quality.db
            echo "Restored history of run $previous."
          fi
      - name: qi collect
        env:
          # A token that may download the producers' artifacts; the workflow token is tried
          # when no COLLECT_TOKEN secret is set (docs/collection.md, "Token")
          GITHUB_TOKEN: ${{ secrets.COLLECT_TOKEN || github.token }}
        run: >-
          qi collect --producers config/producers.toml --database history/quality.db
          --days ${{ inputs.days || '3' }} --summary "$GITHUB_STEP_SUMMARY"
      - name: Keep the history
        # Also after a partly failed collection: what was stored is valid (one transaction per run)
        if: always() && steps.restore.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-history
          path: history/quality.db
          retention-days: 90
          if-no-files-found: error
