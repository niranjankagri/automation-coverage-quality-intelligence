# Producers: the public automation repositories whose CI results are collected (docs/collection.md).
#
# Each job names the artifact it uploads and the ONE path inside it that is imported. The
# enterprise jobs upload Allure results and Surefire JUnit XML of the same execution; only the
# Allure results are named, so no test is counted twice. Every artifact layout below was checked
# against real runs on 2026-10-20 (enterprise 39420085112 and 39385969773, pytest 39403545716,
# Cypress 39403537526, Robot 39392334640).
#
# The other repositories publish JUnit XML as one artifact per job, named junit-<job> and holding
# nothing else (path "."): added on 2026-10-20 (M6), so each has `since` = the start of its
# first run with that contract; earlier runs predate it and are not counted as incomplete.
# `framework` names the runner that wrote the results (testng, junit5, playwright, vitest,
# node-test, k6, ...), as in the samples; the repository filter tells the projects apart.
# Counts of the first run of each were checked against its CI log (docs/collection.md).
#
# Not collected, on purpose:
# - selenium-java-framework: frozen (no changes), its CI keeps an HTML report only;
# - mobile-test-automation-framework: CI compiles only (the app under test may not be
#   redistributed, so no emulator run);
# - k6 soak test (scheduled and manual runs only) and the jobs that fail on purpose
#   (k6 regression-demo, llm/ai "sample answers"): listing them would make pipelines incomplete
#   or permanently red;
# - JBDL, ExampleApp, niranjankagri.github.io: not test automation projects.
# Playwright's JUnit output records a test that passed only on a retry as passed (verified
# 2026-10-20), so flaky Playwright tests are not visible as retries here.

[[producer]]
repository = "niranjankagri/enterprise-test-automation-framework"
workflow = "regression.yml"              # "Main": every push to main
context = { environment = "ci", platform = "linux" }

[[producer.job]]
name = "unit"
artifact = "results-unit"
path = "."                               # the artifact is an allure-results folder

[[producer.job]]
name = "api"
artifact = "results-api"
path = "allure-results"

[[producer.job]]
name = "ui-chrome"
artifact = "results-ui-chrome"
path = "allure-results"
context = { browser = "chrome" }

[[producer.job]]
name = "smoke-edge"
artifact = "results-smoke-edge"
path = "allure-results"
context = { browser = "edge" }

[[producer]]
repository = "niranjankagri/enterprise-test-automation-framework"
