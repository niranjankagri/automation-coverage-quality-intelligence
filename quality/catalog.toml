# This project's own requirements: the acceptance criteria and implementation rules of the
# project plan, each linked to the tests that prove it. CI gates every build on this catalog
# (job "self-gate", gate file quality/release.toml), so the platform checks its own release
# with its own rules.
#
# Test keys are pytest's JUnit names: classname = module path, name = test function (with the
# parametrised id in brackets). Unit tests have no test type of the plan's list; they keep
# test_type unspecified on purpose.

# ---- Acceptance criteria -------------------------------------------------------------------

[[requirement]]
id = "AC-01"
title = "Results from at least two distinct automation projects can be imported successfully"
feature = "Ingestion"
criticality = "critical"

[[requirement]]
id = "AC-02"
title = "Results are normalized without losing essential execution information"
feature = "Ingestion"
criticality = "critical"

[[requirement]]
id = "AC-03"
title = "Requirements can be mapped to test cases"
feature = "Traceability"
criticality = "critical"

[[requirement]]
id = "AC-04"
title = "Coverage gaps and uncovered critical requirements can be identified"
feature = "Traceability"
criticality = "critical"

[[requirement]]
id = "AC-05"
title = "Dashboard metrics match independently verified calculations"
feature = "Dashboard"
criticality = "critical"

[[requirement]]
id = "AC-06"
title = "Historical execution trends can be inspected"
feature = "History"
criticality = "high"

[[requirement]]
id = "AC-07"
title = "Configured quality gates correctly pass or fail a pipeline"
feature = "Quality gates"
criticality = "critical"

[[requirement]]
id = "AC-08"
title = "Automated tests validate core calculations, ingestion and gate behaviour"
feature = "Engineering"
criticality = "high"

[[requirement]]
id = "AC-09"
title = "A clean checkout can reproduce the documented demonstration"
feature = "Engineering"
criticality = "high"

[[requirement]]
id = "AC-10"
title = "Public documentation and reports contain no sensitive data"
feature = "Engineering"
criticality = "critical"

# ---- Implementation rules ------------------------------------------------------------------

[[requirement]]
id = "RULE-01"
title = "Business logic is independent of the dashboard"
feature = "Architecture"
criticality = "high"

[[requirement]]
id = "RULE-02"
title = "Missing or invalid report files cannot produce a successful quality gate"
feature = "Quality gates"
criticality = "critical"

[[requirement]]
id = "RULE-03"
title = "Thresholds are configurable, not hard-coded"
feature = "Quality gates"
criticality = "high"

[[requirement]]
id = "RULE-04"
title = "Flaky-test candidates are claimed only from defined, tested rules"
feature = "History"
criticality = "high"

[[requirement]]
id = "RULE-05"
title = "The dashboard is usable on desktop and mobile"
feature = "Dashboard"
criticality = "medium"

# ---- Post-1.0 plan, phase 3 ----------------------------------------------------------------

[[requirement]]
id = "IMP-01"
title = "Valid requirements import reliably from CSV; invalid records are reported clearly; re-importing does not duplicate"
feature = "Requirements import"
criticality = "high"

[[requirement]]
id = "TREND-01"
title = "Trend charts match the stored execution records; empty and partial data are handled; incomparable days are flagged"
feature = "Dashboard"
criticality = "high"

[[requirement]]
id = "FMT-01"
title = "Cypress (mochawesome) and Allure results normalise into the same model as JUnit XML; malformed and unknown input is reported"
feature = "Ingestion"
criticality = "high"

[[requirement]]
id = "PIPE-01"
title = "Jobs of one pipeline execution are grouped; an incomplete or inconsistent pipeline never gives a release decision; a job attempt is imported once"
feature = "Pipelines"
criticality = "critical"

[[requirement]]
id = "SEC-01"
title = "Hostile input never crashes or executes; no unauthenticated dashboard off this machine; secrets are not stored or reported"
feature = "Security"
criticality = "critical"

[[requirement]]
id = "COL-01"
title = "CI results are collected without manual copying: idempotent per pipeline attempt, one format per job, failed and cancelled runs distinguishable, missing reports visible, safe against hostile artifacts"
feature = "Collection"
criticality = "critical"

[[requirement]]
id = "REFRESH-01"
title = "New data appears in the dashboard without a restart; filters stay; a failed refresh keeps the last good data and is shown as stale"
feature = "Dashboard"
criticality = "high"

[[requirement]]
id = "UI-01"
title = "The overview shows a release status derived from the documented gate policy; unknown evidence is never ready; repository selection applies everywhere"
feature = "Dashboard"
criticality = "high"

[[requirement]]
id = "UI-04"
title = "Pipeline explorer and collection health: every collected pipeline is visible with its status, problems, attempts and links; repositories are flagged when collection is overdue"
feature = "Dashboard"
criticality = "high"

[[requirement]]
id = "UI-05"
title = "Builds are compared only where they ran the same suite; a test can be investigated with its context, pattern, durations, requirements and CI link"
feature = "Dashboard"
criticality = "high"

[[requirement]]
id = "UI-06"
title = "Tables sort, filter, page and export; filters show as chips and are shareable; charts lead to their records by keyboard; requirement and flaky views show their evidence"
feature = "Dashboard"
criticality = "medium"

[[requirement]]
id = "UI-07"
title = "The dashboard passes the automated WCAG 2.2 A/AA checks in both themes, works at phone to desktop widths and in Chromium, Firefox and WebKit"
feature = "Dashboard"
criticality = "high"

