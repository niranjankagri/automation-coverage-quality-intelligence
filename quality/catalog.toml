# This project's own requirements: the acceptance criteria and implementation rules of the
# project plan, each linked to the tests that prove it. CI gates every build on this catalog
# (job "self-gate", gate file quality/release.toml), so the platform checks its own release
# with its own rules.
#
# Test keys are pytest's JUnit names: classname = module path, name = test function (with the
# parametrised id in brackets). Unit tests have no test type of the plan's list; they keep
# test_type unspecified on purpose.

# ---- Acceptance criteria -------------------------------------------------------------------

[[requirement]]
id = "AC-01"
title = "Results from at least two distinct automation projects can be imported successfully"
feature = "Ingestion"
criticality = "critical"

[[requirement]]
id = "AC-02"
title = "Results are normalized without losing essential execution information"
feature = "Ingestion"
criticality = "critical"

[[requirement]]
id = "AC-03"
title = "Requirements can be mapped to test cases"
feature = "Traceability"
criticality = "critical"

[[requirement]]
id = "AC-04"
title = "Coverage gaps and uncovered critical requirements can be identified"
feature = "Traceability"
criticality = "critical"

[[requirement]]
id = "AC-05"
title = "Dashboard metrics match independently verified calculations"
feature = "Dashboard"
criticality = "critical"

[[requirement]]
id = "AC-06"
title = "Historical execution trends can be inspected"
feature = "History"
criticality = "high"

[[requirement]]
id = "AC-07"
title = "Configured quality gates correctly pass or fail a pipeline"
feature = "Quality gates"
criticality = "critical"

[[requirement]]
id = "AC-08"
title = "Automated tests validate core calculations, ingestion and gate behaviour"
feature = "Engineering"
criticality = "high"

[[requirement]]
id = "AC-09"
title = "A clean checkout can reproduce the documented demonstration"
feature = "Engineering"
criticality = "high"

[[requirement]]
id = "AC-10"
title = "Public documentation and reports contain no sensitive data"
feature = "Engineering"
criticality = "critical"

# ---- Implementation rules ------------------------------------------------------------------

[[requirement]]
id = "RULE-01"
title = "Business logic is independent of the dashboard"
feature = "Architecture"
criticality = "high"

[[requirement]]
id = "RULE-02"
title = "Missing or invalid report files cannot produce a successful quality gate"
feature = "Quality gates"
criticality = "critical"

[[requirement]]
id = "RULE-03"
title = "Thresholds are configurable, not hard-coded"
feature = "Quality gates"
criticality = "high"

[[requirement]]
id = "RULE-04"
title = "Flaky-test candidates are claimed only from defined, tested rules"
feature = "History"
criticality = "high"

[[requirement]]
id = "RULE-05"
title = "The dashboard is usable on desktop and mobile"
feature = "Dashboard"
criticality = "medium"

# ---- Test cases ----------------------------------------------------------------------------

[[test_case]]
id = "TC-IMPORT-REAL-SAMPLES"
title = "Real results of pytest, Robot Framework, Surefire/TestNG and Playwright import cleanly"
automation_status = "automated"
test_type = "integration"
framework = "pytest"
requirements = ["AC-01"]
automated_by = [
  "tests.integration.test_real_samples::test_all_samples_import_as_one_batch_without_errors",
  "tests.integration.test_real_samples::test_every_sample_folder_is_known",
]

[[test_case]]
id = "TC-NORMALISATION"
title = "Counts match the producers' totals; context, time and failure details survive"
automation_status = "automated"
test_type = "integration"
framework = "pytest"
requirements = ["AC-02"]
automated_by = [
  "tests.integration.test_real_samples::test_counts_match_the_producers_own_totals*",
  "tests.integration.test_real_samples::test_context_and_time_survive_the_import*",
  "tests.integration.test_real_samples::test_real_selenium_timeout_is_kept_with_its_details",
  "tests.integration.test_real_samples::test_playwright_attempts_show_failure_error_then_pass",
]

[[test_case]]
id = "TC-JUNIT-PARSER"
title = "JUnit XML importer: outcomes, reruns, nested suites, ids, timestamps, bad files"
automation_status = "automated"
framework = "pytest"
requirements = ["AC-02", "AC-08"]
automated_by = ["tests.unit.ingest.test_junit::*", "tests.unit.ingest.test_batch::*"]

[[test_case]]
