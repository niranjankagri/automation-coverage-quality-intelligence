<!doctype html>
<!-- Quality gate report. Filled by qualityintel.reporting.gate_report.to_html: every inserted value is
     HTML-escaped before it is inserted. No script, no external resource: the file is opened
     from CI artifacts, often offline. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title</title>
<style>
:root {
  --bg: #f6f7f9; --fg: #1c2430; --muted: #5b6676; --line: #d9dee6;
  --ok: #1d7a46; --okbg: #e3f4ea; --bad: #b42318; --badbg: #fde8e6; --warn: #8a5a00; --warnbg: #fff3d6;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12161c; --fg: #e6eaf0; --muted: #a0abba; --line: #2d3644;
    --ok: #6fd39b; --okbg: #173326; --bad: #ff8f84; --badbg: #3a1d1b; --warn: #f2c35b; --warnbg: #3a2f14;
    color-scheme: dark;
  }
}
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { margin: 0; font-size: 22px; }
h2 { font-size: 17px; margin: 28px 0 8px; }
.verdict { padding: 16px 20px; border-radius: 10px; border: 1px solid; }
.verdict.passed { background: var(--okbg); color: var(--ok); }
.verdict.failed { background: var(--badbg); color: var(--bad); }
.verdict.incomplete { background: var(--warnbg); color: var(--warn); }
.verdict p { margin: 4px 0 0; font-weight: 600; }
.verdict .meta { font-weight: 400; font-size: 13px; }
.wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-size: 12.5px; }
tr.bad td.result { color: var(--bad); font-weight: 700; }
tr.ok td.result { color: var(--ok); }
.sub { color: var(--muted); font-size: 12.5px; }
.cards { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.card { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.label { color: var(--muted); font-size: 13px; }
.value { font-size: 20px; font-weight: 700; }
dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; }
dt { color: var(--muted); }
dd { margin: 0; word-break: break-word; }
code { font-size: 13px; }
</style>
</head>
<body>
<main>
<header class="verdict $status">
  <h1>$gate_name</h1>
  <p>$status_text</p>
  <p class="meta">$meta</p>
</header>
$problems
$pipeline
<section>
  <h2>Rules</h2>
  <div class="wrap"><table>
    <thead><tr><th>Rule</th><th>Actual</th><th>Expected</th><th>Result</th><th>Items</th></tr></thead>
    <tbody>$rule_rows</tbody>
  </table></div>
</section>
<section>
  <h2>Metrics</h2>
  <div class="cards">$cards</div>
</section>
<section>
  <h2>Gaps</h2>
  <dl>$gaps</dl>
</section>
<section>
  <h2>Inputs</h2>
  <p>$inputs</p>
  <div class="wrap"><table>
    <thead><tr><th>Run</th><th>Framework</th><th>Browser</th><th>Build</th><th>Started</th><th>Passed</th><th>Failed</th><th>Error</th><th>Skipped</th></tr></thead>
    <tbody>$run_rows</tbody>
  </table></div>
</section>
</main>
</body>
</html>
