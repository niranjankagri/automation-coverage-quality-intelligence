# Demonstration catalog: SYNTHETIC requirements and test cases.
#
# The requirements come from requirements.csv (as if exported from an issue tracker) and are
# written to requirements.toml by `qi requirements import`; this file holds the hand-written
# test cases and their links, which an import never touches (docs/requirements-import.md).
#
# The requirements are invented for this demonstration (no real product, customer or employer
# document behind them). They describe the four public demo applications that my test
# repositories exercise, and the test cases point at the REAL tests whose CI results are in
# samples/results. Gaps are deliberate, so the traceability report has something to find:
#   - requirements with no test at all (NOTES-012, SHOP-010, ADMIN-010, ADMIN-012)
#   - requirements whose test cases are manual, planned or blocked (NOTES-011, SHOP-008,
#     SHOP-009, SAUCE-008, ADMIN-009, ADMIN-011)
#   - critical requirements without automation (SHOP-008, ADMIN-012)
#   - an automated test case linked to no requirement (TC-NOTES-HEALTH)
#   - real tests no test case claims: the database layer's own self-checks
#
# Patterns: `classname::name`, wildcards * and ? only ([ and ] are literal).

include = ["requirements.toml"]

# Shown on every dashboard page, so nobody takes the coverage figures for a real product's
notice = "The 42 requirements and 44 test cases are a synthetic sample catalog for the demo applications; the test executions and pipelines are real CI results."

