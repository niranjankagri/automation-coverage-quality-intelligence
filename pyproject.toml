# Automation Coverage & Quality Intelligence: one Python package (src layout) with a `qi` command.
# Runtime dependencies are added milestone by milestone, only when code uses them.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "automation-coverage-quality-intelligence"
version = "1.2.1"
description = "Imports results from existing test automation frameworks, measures requirement and automation coverage, tracks failures and flaky-test candidates, and runs release quality gates."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Niranjan Kumar Agri" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.14.1",
    # dashboard (Milestone 5): JSON API and a static single-page front end
    "fastapi==0.143.5",
    "uvicorn==0.54.0",
    # pinned: FastAPI only sets a lower bound, and newer releases change the test client
    "starlette==1.8.0",
]

[project.optional-dependencies]
# Pinned so a local run and CI use the same tool versions
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.1",
    "mypy==2.4.0",
    # HTTP client behind FastAPI's TestClient (starlette deprecated plain httpx for it)
    "httpx2==2.13.1",
]
# Browser tests of the dashboard (tests/e2e); needs `playwright install chromium` once.
# axe-playwright-python runs axe-core (MPL 2.0, used at test time only) for the WCAG checks.
e2e = [
    "playwright==1.63.0",
    "axe-playwright-python==0.1.8",
]

[project.scripts]
qi = "qualityintel.cli:main"

[project.urls]
Repository = "https://github.com/niranjankagri/automation-coverage-quality-intelligence"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# py.typed tells type checkers that the package ships its own type hints
qualityintel = [
    "py.typed",
    "dashboard/static/*",
    "dashboard/static/next/*",
    "dashboard/static/next/js/*",
    "reporting/templates/*",
]

# ruff: linter and formatter, run in CI before any test
[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, B bugbear, UP pyupgrade, PT pytest style,
# SIM simplify, RUF ruff's own rules, D docstrings (every public item explains itself)
select = ["E", "W", "F", "I", "B", "UP", "PT", "SIM", "RUF", "D"]
# D105/D107: magic methods and __init__ are covered by the class docstring
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test modules and packages need no module docstring; each test function still has one.
# E501: inline XML samples read better on one line than wrapped.
"tests/**" = ["D100", "D104", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["qualityintel"]

# mypy in strict mode for the package and the tests
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "tools"]
plugins = ["pydantic.mypy"]

# The accessibility checker used by the browser tests ships without type information
[[tool.mypy.overrides]]
module = ["axe_playwright_python.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
# Constructor calls are type-checked against the field types
init_typed = true
init_forbid_extra = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# -ra lists every non-passing test at the end; strict options turn typos in markers/config into errors
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not e2e"]
xfail_strict = true
# Any warning (deprecations, unclosed files or databases) fails the run instead of scrolling by
filterwarnings = ["error"]
markers = [
    "unit: fast tests of one module, no files or processes outside tmp_path",
    "integration: tests that run the installed package as a separate process",
    "e2e: dashboard tests in a real browser (deselected unless -m e2e is given)",
    "performance: structural and time guards on production-sized data (docs/performance.md)",
]

[tool.coverage.run]
source = ["qualityintel"]
branch = true
# __main__ is only one line and runs in a separate process (tests/integration), where
# coverage is not recorded
omit = ["*/qualityintel/__main__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 90
